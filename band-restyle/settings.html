<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Band Restyle — настройки</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <header>
      <h1>Вид Band</h1>
      <button id="openFull" class="link" hidden>Все настройки ↗</button>
    </header>

    <h2>Стиль</h2>
    <div id="styles" class="seg"></div>

    <section id="glassOnly">
      <h2>Фон</h2>
      <div id="walls" class="walls"></div>
      <input id="wallFile" type="file" accept="image/*" multiple hidden>
      <div class="sliders">
        <label>Затемнение <input id="dim" type="range" min="0" max="50" step="1"></label>
        <label>Размытие стекла <input id="blur" type="range" min="0" max="40" step="1"></label>
        <label>Непрозрачность окна чата <input id="chatOpacity" type="range" min="50" max="100" step="1"></label>
        <label>Скругление углов <input id="radius" type="range" min="0" max="28" step="1"></label>
      </div>
    </section>

    <h2>Боковая панель</h2>
    <div id="sidebarTones" class="seg3"></div>

    <h2>Тема</h2>
    <div id="themes" class="grid"></div>
    <div id="customColors" class="colors">
      <label><input id="customColor" type="color"> Основной цвет <small>кнопки, упоминания, ссылки</small></label>
      <label><input id="customColor2" type="color"> Второй цвет <small>градиенты и активный канал</small></label>
    </div>

    <h2>Цвет текста</h2>
    <div class="textColors">
      <div id="headerTextRow">
        <p class="sub">Верхняя панель — поиск и кнопки</p>
        <div class="seg3" id="headerTexts"></div>
        <label class="pick" id="headerTextPick"><input id="headerTextColor" type="color"> свой цвет</label>
      </div>
      <div>
        <p class="sub">Имена авторов и ссылки</p>
        <div class="seg3" id="accentTexts"></div>
        <label class="pick" id="accentTextPick"><input id="accentTextColor" type="color"> свой цвет</label>
      </div>
    </div>

    <h2>Шрифт</h2>
    <div id="fonts" class="list"></div>
    <p class="sub" style="margin-top:12px">Заголовки (название канала и команды)</p>
    <div id="displayFonts" class="seg3"></div>

    <p class="hint">Код в сообщениях остаётся моноширинным. Свои картинки хранятся только в этом браузере.</p>
  </main>
  <script src="palettes.js"></script>
  <script src="settings.js"></script>
</body>
</html>
